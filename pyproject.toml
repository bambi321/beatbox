[project]
name = "beatbox"
version = "0.1.0"
description = "Original, royalty-free house music composed in Python, styled after a YouTube reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pedalboard>=0.9",
    "pyloudnorm>=0.1",
    "pillow>=10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["beatbox"]
